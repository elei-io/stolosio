{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "harbor.serviceAccountName" . }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "harbor.fullname" . }}-fleet-controller
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ printf "%s-browserless-workload" (include "harbor.fullname" .) | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "harbor.fullname" . }}-fleet-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "harbor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "harbor.fullname" . }}-fleet-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harbor.fullname" . }}-fleet-controller
  labels:
    {{- include "harbor.labels" . | nindent 4 }}
    app.kubernetes.io/component: fleet-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "harbor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: fleet-controller
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "harbor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fleet-controller
        {{- include "harbor.extraPodLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "harbor.serviceAccountName" . }}
      {{- include "harbor.commonPodSpec" . | nindent 6 }}
      containers:
        - name: fleet-controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/.venv/bin/python", "-m", "backend.fleet.controllers.kubernetes"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.urlSecretKey }}
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBERNETES_BROWSERLESS_STATEFULSET
              value: {{ include "harbor.fullname" . }}-browserless
            - name: KUBERNETES_BROWSERLESS_WORKLOAD_CONFIG_MAP
              value: {{ include "harbor.fullname" . }}-browserless-workload
            - name: KUBERNETES_BROWSERLESS_HEADLESS_SERVICE
              value: {{ include "harbor.fullname" . }}-browserless-headless
            - name: FLEET_RECONCILE_INTERVAL_SECONDS
              value: {{ .Values.fleetController.reconcileIntervalSeconds | quote }}
            - name: FLEET_OBSERVATION_TTL_SECONDS
              value: {{ .Values.fleetController.observationTtlSeconds | quote }}
            - name: FLEET_INSTANCE_STARTUP_TIMEOUT_SECONDS
              value: {{ .Values.fleetController.instanceStartupTimeoutSeconds | quote }}
            - name: FLEET_CONTROLLER_METRICS_PORT
              value: {{ .Values.fleetController.metricsPort | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.fleetController.metricsPort }}
          resources:
            {{- toYaml .Values.fleetController.resources | nindent 12 }}
