{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "harbor.fullname" . }}-api-metrics
  labels:
    {{- include "harbor.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    harbor.ekkuleivonen.io/metrics: "true"
    {{- with .Values.monitoring.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
    {{- with .Values.monitoring.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "harbor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: metrics
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "harbor.fullname" . }}-fleet-controller-metrics
  labels:
    {{- include "harbor.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    harbor.ekkuleivonen.io/metrics: "true"
    {{- with .Values.monitoring.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: {{ .Values.fleetController.metricsPort | quote }}
    {{- with .Values.monitoring.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "harbor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: fleet-controller
  ports:
    - name: metrics
      port: {{ .Values.fleetController.metricsPort }}
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "harbor.fullname" . }}-maintenance-metrics
  labels:
    {{- include "harbor.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    harbor.ekkuleivonen.io/metrics: "true"
    {{- with .Values.monitoring.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: {{ .Values.maintenance.metricsPort | quote }}
    {{- with .Values.monitoring.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "harbor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: maintenance
  ports:
    - name: metrics
      port: {{ .Values.maintenance.metricsPort }}
      targetPort: metrics
{{- if .Values.monitoring.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "harbor.fullname" . }}
  labels:
    {{- include "harbor.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "harbor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
      harbor.ekkuleivonen.io/metrics: "true"
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- end }}
