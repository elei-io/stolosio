apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harbor.fullname" . }}-maintenance
  labels:
    {{- include "harbor.labels" . | nindent 4 }}
    app.kubernetes.io/component: maintenance
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "harbor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: maintenance
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "harbor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: maintenance
        {{- include "harbor.extraPodLabels" . | nindent 8 }}
    spec:
      {{- include "harbor.commonPodSpec" . | nindent 6 }}
      containers:
        - name: maintenance
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/.venv/bin/python", "-m", "backend.workers.maintenance"]
          env:
            {{- include "harbor.connectionEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.maintenance.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harbor.fullname" . }}-health
  labels:
    {{- include "harbor.labels" . | nindent 4 }}
    app.kubernetes.io/component: health
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "harbor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: health
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "harbor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: health
        {{- include "harbor.extraPodLabels" . | nindent 8 }}
    spec:
      {{- include "harbor.commonPodSpec" . | nindent 6 }}
      containers:
        - name: health
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/.venv/bin/python", "-m", "backend.workers.health"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.urlSecretKey }}
            - name: HEALTH_HARBOR_CDP_URL
              value: ws://{{ include "harbor.fullname" . }}-api:{{ .Values.api.service.port }}/v1/connect
          resources:
            {{- toYaml .Values.health.resources | nindent 12 }}
