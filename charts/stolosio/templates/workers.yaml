apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stolosio.fullname" . }}-maintenance
  {{- with .Values.workloadAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "stolosio.labels" . | nindent 4 }}
    app.kubernetes.io/component: maintenance
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "stolosio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: maintenance
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "stolosio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: maintenance
        {{- include "stolosio.extraPodLabels" . | nindent 8 }}
    spec:
      {{- include "stolosio.commonPodSpec" . | nindent 6 }}
      containers:
        - name: maintenance
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/.venv/bin/python", "-m", "backend.workers.maintenance"]
          env:
            {{- include "stolosio.connectionEnv" . | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.maintenance.metricsPort }}
          startupProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: metrics
          resources:
            {{- toYaml .Values.maintenance.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stolosio.fullname" . }}-health
  {{- with .Values.workloadAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "stolosio.labels" . | nindent 4 }}
    app.kubernetes.io/component: health
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "stolosio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: health
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "stolosio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: health
        {{- include "stolosio.extraPodLabels" . | nindent 8 }}
    spec:
      {{- include "stolosio.commonPodSpec" . | nindent 6 }}
      containers:
        - name: health
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/.venv/bin/python", "-m", "backend.workers.health"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.urlSecretKey }}
            - name: HEALTH_STOLOSIO_CDP_URL
              value: ws://{{ include "stolosio.fullname" . }}-api:{{ .Values.api.service.port }}/v1/connect
          resources:
            {{- toYaml .Values.health.resources | nindent 12 }}
