apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stolosio.fullname" . }}-migrate
  labels:
    {{- include "stolosio.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "stolosio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
        {{- include "stolosio.extraPodLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "stolosio.commonPodSpec" . | nindent 6 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/.venv/bin/alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.urlSecretKey }}
