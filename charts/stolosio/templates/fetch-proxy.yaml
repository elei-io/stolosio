apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stolosio.fullname" . }}-fetch-proxy
  labels:
    {{- include "stolosio.labels" . | nindent 4 }}
    app.kubernetes.io/component: fetch-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stolosio-fetch-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: fetch-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stolosio-fetch-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: fetch-proxy
    spec:
      automountServiceAccountToken: false
      {{- include "stolosio.commonPodSpec" . | nindent 6 }}
      containers:
        - name: fetch-proxy
          image: "{{ .Values.fetchProxy.image.repository }}:{{ default .Values.image.tag .Values.fetchProxy.image.tag }}"
          imagePullPolicy: {{ .Values.fetchProxy.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            capabilities:
              add: [NET_ADMIN]
          env:
            - name: EGRESS_EXTRA_BLOCKED_CIDRS
              value: {{ join " " .Values.egress.extraBlockedCidrs | quote }}
          ports:
            - name: proxy
              containerPort: 3128
          startupProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: proxy
          livenessProbe:
            tcpSocket:
              port: proxy
          resources:
            {{- toYaml .Values.fetchProxy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stolosio.fullname" . }}-fetch-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stolosio-fetch-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: fetch-proxy
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
