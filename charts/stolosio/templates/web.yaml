apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stolosio.fullname" . }}-web
  {{- with .Values.workloadAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "stolosio.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "stolosio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "stolosio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
        {{- include "stolosio.extraPodLabels" . | nindent 8 }}
    spec:
      {{- include "stolosio.commonPodSpec" . | nindent 6 }}
      containers:
        - name: web
          image: "{{ .Values.webImage.repository }}:{{ .Values.webImage.tag }}"
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          env:
            - name: STOLOSIO_API_PROXY_TARGET
              value: http://{{ include "stolosio.fullname" . }}-api:{{ .Values.api.service.port }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stolosio.fullname" . }}-web
  labels:
    {{- include "stolosio.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  annotations:
    {{- toYaml .Values.web.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  {{- with .Values.web.service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  selector:
    {{- include "stolosio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
