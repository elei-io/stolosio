name: harbor

services:
  api:
    build: .
    command: uv run uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://harbor:harbor@postgres:5432/harbor
      REDIS_URL: redis://redis:6379/0
      BROWSERLESS_URL: ws://browserless:3000
      CAMOUFOX_URL: ws://camoufox:1234/harbor
      CHROMIUM_URL: ws://chromium:9222
      LIGHTPANDA_URL: ws://lightpanda:9222
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: harbor
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  browserless:
    image: ghcr.io/browserless/chromium:latest
    environment:
      CONCURRENT: "5"
      QUEUED: "10"
      TIMEOUT: "60000"
    ports:
      - "3000:3000"

  chromium:
    image: chromedp/headless-shell:latest
    shm_size: 2gb
    ports:
      - "9223:9222"

  camoufox:
    build:
      context: docker/camoufox
    shm_size: 2gb
    ports:
      - "1234:1234"

  lightpanda:
    image: lightpanda/browser:nightly
    environment:
      LIGHTPANDA_DISABLE_TELEMETRY: "true"
    ports:
      - "9222:9222"

volumes:
  postgres_data:
  redis_data:
