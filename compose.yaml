name: stolosio

services:
  api:
    build: .
    networks: [default, page-egress]
    command: >-
      sh -c "uv run alembic upgrade head &&
      uv run uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://stolosio:stolosio@postgres:5432/stolosio
      NATS_URL: nats://nats:4222
      BROWSERLESS_URL: ws://browserless:3000
      BROWSERLESS_SESSION_TIMEOUT_SECONDS: "600"
      HTTP_FETCH_PROXY_URL: http://fetch-proxy:3128
    ports:
      - "127.0.0.1:${STOLOSIO_API_PORT:-8411}:8000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 20

  admin:
    build:
      context: admin
      target: development
    environment:
      STOLOSIO_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${STOLOSIO_ADMIN_PORT:-5173}:5173"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:5173
      interval: 5s
      timeout: 3s
      retries: 20

  maintenance:
    build: .
    command: uv run python -m backend.workers.maintenance
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://stolosio:stolosio@postgres:5432/stolosio
      NATS_URL: nats://nats:4222
    expose:
      - "9000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  health:
    build: .
    command: uv run python -m backend.workers.health
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://stolosio:stolosio@postgres:5432/stolosio
      HEALTH_STOLOSIO_CDP_URL: ws://api:8000/v1/connect
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: stolosio
      POSTGRES_USER: stolosio
      POSTGRES_PASSWORD: stolosio
    ports:
      - "127.0.0.1:${STOLOSIO_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stolosio -d stolosio"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:latest
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4223:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data

  browserless:
    image: stolosio-browserless:local
    networks: [page-egress]
    build:
      context: runtime
      dockerfile: Dockerfile.browserless
    cap_add:
      - NET_ADMIN
    environment:
      CONCURRENT: "${STOLOSIO_BROWSERLESS_CONCURRENT:-5}"
      QUEUED: "10"
      TIMEOUT: "600000"
    expose:
      - "3000"

  fetch-proxy:
    image: stolosio-fetch-proxy:local
    networks: [page-egress]
    build:
      context: runtime
      dockerfile: Dockerfile.fetch-proxy
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:3128:3128"

networks:
  page-egress: {}

volumes:
  postgres_data:
  nats_data:
  admin_node_modules:
