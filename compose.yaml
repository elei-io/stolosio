name: harbor

services:
  api:
    build: .
    command: >-
      sh -c "uv run alembic upgrade head &&
      uv run uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://harbor:harbor@postgres:5432/harbor
      NATS_URL: nats://nats:4222
      BROWSERLESS_URL: ws://browserless:3000
      CAMOUFOX_URL: ws://camoufox:1234/harbor
      CHROMIUM_URL: ws://chromium:9222
      LIGHTPANDA_URL: ws://lightpanda:9222
    ports:
      - "${HARBOR_API_PORT:-8411}:8000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 20

  maintenance:
    build: .
    command: uv run python -m backend.workers.maintenance
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://harbor:harbor@postgres:5432/harbor
      NATS_URL: nats://nats:4222
    expose:
      - "9000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: harbor
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor
    ports:
      - "${HARBOR_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbor"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:latest
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4223:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  browserless:
    image: ghcr.io/browserless/chromium:latest
    environment:
      CONCURRENT: "5"
      QUEUED: "10"
      TIMEOUT: "60000"
    ports:
      - "3000:3000"

  chromium:
    image: chromedp/headless-shell:latest
    shm_size: 2gb
    ports:
      - "9223:9222"

  camoufox:
    build:
      context: docker/camoufox
    shm_size: 2gb
    ports:
      - "1234:1234"

  lightpanda:
    image: lightpanda/browser:nightly
    environment:
      LIGHTPANDA_DISABLE_TELEMETRY: "true"
    ports:
      - "9222:9222"

volumes:
  postgres_data:
  nats_data:
