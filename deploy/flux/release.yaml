apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: harbor-chart
  values:
    database:
      existingSecret: harbor-connections
      urlSecretKey: database-url
    nats:
      existingSecret: harbor-connections
      urlSecretKey: nats-url
    imagePullSecrets:
      - name: ghcr-auth
