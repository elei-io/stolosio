name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stolosio
          POSTGRES_USER: stolosio
          POSTGRES_PASSWORD: stolosio
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stolosio -d stolosio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Start NATS with JetStream
        run: |
          docker run --detach \
            --name stolosio-ci-nats \
            --publish 4223:4222 \
            --mount type=volume,destination=/data \
            nats:2.11-alpine \
            -js -sd /data

          for _ in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/4223) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs stolosio-ci-nats
          exit 1

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -m "not e2e"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  public-site:
    name: Public site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: public-site
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: public-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify generated site
        run: npm test

      - name: Check formatting
        run: npm run lint

      - name: Build and test public static server
        run: |
          docker build -t stolosio-public:test .
          bash scripts/container-test.sh stolosio-public:test

  containers:
    name: Container (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stolosio
            context: .
            platforms: linux/amd64,linux/arm64
          - name: stolosio-admin
            context: ./admin
            platforms: linux/amd64,linux/arm64
          - name: stolosio-browserless
            context: ./runtime
            file: ./runtime/Dockerfile.browserless
            platforms: linux/amd64,linux/arm64
          - name: stolosio-fetch-proxy
            context: ./runtime
            file: ./runtime/Dockerfile.fetch-proxy
            platforms: linux/amd64,linux/arm64
          - name: stolosio-public
            context: ./public-site
            platforms: linux/amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}

  helm:
    name: Helm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.0

      - name: Lint chart
        run: >-
          helm lint charts/stolosio
          --set database.existingSecret=stolosio-connections
          --set nats.existingSecret=stolosio-connections

      - name: Validate rendered Kubernetes resources
        run: |
          helm template stolosio charts/stolosio \
            --namespace stolosio \
            --set monitoring.enabled=true \
            --set monitoring.dashboard.enabled=true \
            --set monitoring.prometheusRule.enabled=true \
            --set database.existingSecret=stolosio-connections \
            --set nats.existingSecret=stolosio-connections \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
                -strict -summary -ignore-missing-schemas

  egress:
    name: Page-fetch isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Build isolated runtimes
        run: |
          docker build -f runtime/Dockerfile.browserless -t stolosio-browserless:egress-test runtime
          docker build -f runtime/Dockerfile.fetch-proxy -t stolosio-fetch-proxy:egress-test runtime
      - name: Verify the connection boundary
        run: uv run python tests/runtime/check.py
