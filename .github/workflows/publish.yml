name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify release versions
        if: github.ref_type == 'tag'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_VERSION#v}"
          chart_version="$(awk '$1 == "version:" {print $2}' charts/stolosio/Chart.yaml)"
          app_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' charts/stolosio/Chart.yaml)"
          project_version="$(awk -F '"' '$1 ~ /^version = / {print $2; exit}' pyproject.toml)"
          image_tag="$(awk '$1 == "image:" {section = "image"; next} section == "image" && $1 == "tag:" {gsub(/"/, "", $2); print $2; exit}' charts/stolosio/values.yaml)"
          admin_image_tag="$(awk '$1 == "adminImage:" {section = "admin"; next} section == "admin" && $1 == "tag:" {gsub(/"/, "", $2); print $2; exit}' charts/stolosio/values.yaml)"

          if [ "${release_version}" != "${chart_version}" ] \
            || [ "${release_version}" != "${app_version}" ] \
            || [ "${release_version}" != "${project_version}" ] \
            || [ "${release_version}" != "${image_tag}" ] \
            || [ "${release_version}" != "${admin_image_tag}" ]; then
            echo "Git tag, project, chart, and default Stolosio image versions must match."
            echo "tag=${release_version} project=${project_version} chart=${chart_version}"
            echo "appVersion=${app_version} image=${image_tag} adminImage=${admin_image_tag}"
            exit 1
          fi

  images:
    name: Image (${{ matrix.name }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stolosio
            context: .
            platforms: linux/amd64,linux/arm64
          - name: stolosio-admin
            context: ./admin
            platforms: linux/amd64,linux/arm64
          - name: stolosio-browserless
            context: ./runtime
            file: ./runtime/Dockerfile.browserless
            platforms: linux/amd64,linux/arm64
          - name: stolosio-fetch-proxy
            context: ./runtime
            file: ./runtime/Dockerfile.fetch-proxy
            platforms: linux/amd64,linux/arm64
          - name: stolosio-public
            context: ./public-site
            platforms: linux/amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Derive image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          pull: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=publish-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.name }}
          provenance: mode=max
          sbom: true

  chart:
    name: Helm chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.0

      - name: Package chart
        run: helm package charts/stolosio --destination dist

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          helm registry login ghcr.io
          --username "${{ github.actor }}"
          --password-stdin
          <<< "${GHCR_TOKEN}"

      - name: Publish chart
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_VERSION#v}"
          helm push "dist/stolosio-${release_version}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
